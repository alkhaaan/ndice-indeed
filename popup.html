<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NDice Indeed</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="container">
    <h1>NDice Indeed</h1>

    <section class="card">
      <h2>Schedule (Local Time)</h2>
      <p class="small">Runs daily at <strong>3 random times</strong> in your local timezone, outside quiet hours of <strong>11:00 PM to 5:00 AM</strong>.</p>
      <label class="row">
        <span>Enable scheduler</span>
        <input id="scheduleEnabled" type="checkbox" />
      </label>
    </section>

    <section class="card">
      <h2>Automation</h2>
      <label>Dice Search URL</label>
      <input id="searchUrl" type="text" />

      <label>Max jobs per run</label>
      <input id="maxJobsPerRun" type="number" min="1" max="100" />

      <label>Max listing pages per run</label>
      <input id="maxPaginationPages" type="number" min="1" max="25" />

      <label>Max form steps per job</label>
      <input id="maxFormSteps" type="number" min="1" max="30" />

      <label class="row">
        <span>Dry run (no final submit)</span>
        <input id="dryRun" type="checkbox" />
      </label>
    </section>

    <section class="card">
      <h2>Profile Autofill</h2>
      <input id="fullName" type="text" placeholder="Full name" />
      <input id="email" type="email" placeholder="Email" />
      <input id="phone" type="text" placeholder="Phone" />
      <input id="city" type="text" placeholder="City" />
      <input id="linkedin" type="text" placeholder="LinkedIn URL" />
      <input id="website" type="text" placeholder="Portfolio / Website" />
      <input id="salaryExpectation" type="text" placeholder="Salary expectation" />
      <input id="workAuthorization" type="text" placeholder="Work authorization" />
    </section>

    <section class="card">
      <h2>Status</h2>
      <p id="statusText" class="small">Loading status...</p>
      <div class="buttonRow">
        <button id="saveBtn">Save</button>
        <button id="runNowBtn">Run now</button>
      </div>
      <div class="buttonRow">
        <button id="stopBtn" class="danger">Stop Scheduler</button>
        <button id="openLogsBtn">Open logs</button>
      </div>
      <div class="buttonRow">
        <button id="clearLogsBtn">Clear logs</button>
        <button id="resumeBtn">Resume Scheduler</button>
      </div>
      <div class="buttonRow single">
        <button id="resetSubmittedHistoryBtn" class="warning">Reset Submitted History</button>
      </div>
    </section>

    <p id="feedback" class="small"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
